<!DOCTYPE html>
<!--
=====================  WKPer - GUIA RAPIDO (arquivo unico)  =====================
IMPORTANTE ao atualizar de uma versao anterior: cole de novo as REGRAS abaixo no Firestore (passo 2).

1) Console do Firebase: crie o projeto e ative Authentication (E-mail/Senha) e Firestore.
2) Firestore > Regras: apague tudo, cole SOMENTE o bloco que comeca em "rules_version" e clique em Publicar.
3) Primeiro administrador: em Authentication crie um usuario (e-mail e senha). Em Firestore crie o
   documento users/<UID desse usuario> com: nome, email, perfil = "admin", ativo = true, telefone = "".
4) Publique este arquivo (com o nome index.html) no Firebase Hosting ou em outra hospedagem.

----- REGRAS DO FIRESTORE -----
rules_version = '2';
service cloud.firestore {
  match /databases/{d}/documents {
    function me() { return get(/databases/$(d)/documents/users/$(request.auth.uid)).data; }
    function ok() { return request.auth != null && exists(/databases/$(d)/documents/users/$(request.auth.uid)) && me().ativo == true; }
    function full() { return ok() && me().perfil == 'admin'; }
    function adm() { return ok() && me().perfil in ['admin','coordenador']; }
    function stf() { return ok() && me().perfil in ['admin','coordenador','professor']; }
    function own() { return ok() && me().perfil == 'aluno' && resource.data.alunoId == me().alunoId; }
    function profDe(id) { return id is string && exists(/databases/$(d)/documents/disciplinas/$(id)) && get(/databases/$(d)/documents/disciplinas/$(id)).data.professorId == request.auth.uid; }
    function ehProf() { return ok() && me().perfil == 'professor'; }

    match /users/{u} {
      allow read: if request.auth != null && (request.auth.uid == u || adm());
      allow create, delete: if full();
      allow update: if full() || (request.auth.uid == u &&
        request.resource.data.diff(resource.data).affectedKeys().hasOnly(['nome','telefone']));
    }
    match /alunos/{a}       { allow read: if stf() || (ok() && me().alunoId == a); allow write: if adm(); }
    match /professores/{x}  { allow read: if stf(); allow write: if adm(); }
    match /turmas/{x}       { allow read: if ok(); allow write: if adm(); }
    match /disciplinas/{x}  { allow read: if ok(); allow write: if adm(); }
    match /horarios/{x}     { allow read: if ok(); allow write: if adm(); }
    match /config/{x}       { allow read: if ok(); allow write: if full() || (adm() && x != 'escola'); }
    match /ocorrencias/{x}  { allow read: if stf() || own(); allow write: if stf(); }
    match /logs/{x} {
      allow read: if adm();
      allow create: if ok() && request.resource.data.porId == request.auth.uid;
    }
    match /chamadas/{x} {
      allow read: if stf() || own();
      allow create, update: if adm() || (ehProf() && profDe(request.resource.data.disciplinaId)
        && request.resource.data.status in ['P','F'] && (resource == null || resource.data.status != 'J'));
      allow delete: if adm() || (ehProf() && profDe(resource.data.disciplinaId) && resource.data.status != 'J');
    }
    match /notas/{x} {
      allow read: if stf() || (own() && resource.data.liberado == true);
      allow create, update: if adm() || (ehProf() && profDe(request.resource.data.disciplinaId));
      allow delete: if adm() || (ehProf() && profDe(resource.data.disciplinaId));
    }
    match /justificativas/{x} {
      allow read: if adm() || own();
      allow create: if ok() && me().perfil == 'aluno' && request.resource.data.alunoId == me().alunoId
        && request.resource.data.status == 'Pendente';
      allow update, delete: if adm();
    }
    match /solicitacoes/{x} {
      allow read: if adm() || own();
      allow create: if ok() && me().perfil == 'aluno' && request.resource.data.alunoId == me().alunoId
        && request.resource.data.status == 'Pendente';
      allow update: if adm();
      allow delete: if adm() || (own() && resource.data.status == 'Pendente');
    }
    match /responsaveis/{x} { allow read: if adm(); allow write: if full(); }
    match /documentos/{x} {
      allow get: if true;
      allow list: if adm() || own();
      allow create: if adm() && request.resource.data.assinanteId is string
        && exists(/databases/$(d)/documents/responsaveis/$(request.resource.data.assinanteId))
        && get(/databases/$(d)/documents/responsaveis/$(request.resource.data.assinanteId)).data.userId == request.auth.uid;
      allow update: if false;
      allow delete: if adm();
    }
    match /tarefas/{x} {
      match /gab/{g} {
        allow read, write: if adm() || (ehProf() && profDe(getAfter(/databases/$(d)/documents/tarefas/$(x)).data.disciplinaId));
      }
      allow read: if ok();
      allow create: if adm() || (ehProf() && profDe(request.resource.data.disciplinaId));
      allow update, delete: if adm() || (ehProf() && profDe(resource.data.disciplinaId));
    }
    match /entregas/{x} {
      allow read: if stf() || own();
      allow create: if ok() && me().perfil == 'aluno' && request.resource.data.alunoId == me().alunoId
        && request.resource.data.status == 'Enviada' && request.resource.data.tarefaId is string
        && get(/databases/$(d)/documents/tarefas/$(request.resource.data.tarefaId)).data.prazoTs > request.time;
      allow update: if (ok() && me().perfil == 'aluno' && resource.data.alunoId == me().alunoId && resource.data.status == 'Enviada'
          && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['texto','anexo','anexoNome','enviadoEm','respostas'])
          && get(/databases/$(d)/documents/tarefas/$(resource.data.tarefaId)).data.prazoTs > request.time)
        || adm() || (ehProf() && profDe(resource.data.disciplinaId));
      allow delete: if adm() || (ehProf() && profDe(resource.data.disciplinaId));
    }
    match /textos/{x} {
      allow read, create, delete: if adm();
      allow update: if adm() && resource.data.get('assinado', false) != true;
    }
    match /anexos/{x} {
      allow read: if adm() || own();
      allow create: if ok() && me().perfil == 'aluno' && request.resource.data.alunoId == me().alunoId;
      allow delete: if adm();
    }
    match /materiais/{x} {
      allow read: if adm() || (ok() && resource.data.publicado == true);
      allow write: if adm();
      match /partes/{p} {
        allow read: if adm() || (ok() && get(/databases/$(d)/documents/materiais/$(x)).data.publicado == true);
        allow write: if adm();
      }
    }
  }
}
=================================================================================
-->

function updateMassForm(){
  const dis = $('#mdis')?.value, dt = $('#mdt')?.value, tp = $('#mtp')?.value, dsStr = $('#mds')?.value, box = $('#massTable');
  if(!dis || !box) return;
  const instNameStr = instName(tp, dsStr);
  const elegiveisRecup = new Set(_mn.nt.filter(n => n.disciplinaId == dis && n.tipo == 'Recuperação' && n.instrumento == instNameStr && n.elegivelRecup).map(n => n.alunoId));

  const rows = _mn.al.map(a => {
    const faltou = _mn.ch.some(c => c.alunoId == a.id && c.disciplinaId == dis && c.data == dt && c.status == 'F');
    const isRecup = (tp === 'Recuperação');
    const podeRecup = isRecup ? _mn.nt.some(n => n.alunoId == a.id && n.disciplinaId == dis && n.mencao == 'I') : true;
    
    return `<tr>
      <td>
        <b>${esc(a.nome)}</b>
        ${faltou ? `<br><span class="tag no" style="font-size:11px">Faltou neste dia · receberá N/A</span>` : ''}
        ${isRecup && !podeRecup ? `<br><span class="sm">(Não ficou de recuperação)</span>` : ''}
      </td>
      <td>
        <select name="m_${a.id}" style="width:200px" ${isRecup && !podeRecup ? 'disabled' : ''}>
          ${menOpts(faltou ? 'NA' : '')}
        </select>
      </td>
    </tr>`;
  }).join('');

  box.innerHTML = `<div class="card tw" style="margin-bottom:0"><table><thead><tr><th>Aluno</th><th>Menção</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

async function uloteModal(){
 await loadRef();
 modal('Criar ou Atualizar Alunos em Lote (Planilha)', `
  <p class="sm" style="margin-top:-6px">Envie um arquivo de planilha (.xlsx, .xls ou .csv). O sistema cadastrará ou atualizará <b>estritamente alunos</b>.</p>
  <p class="sm">A planilha deve conter 5 colunas na ordem:<br>
  <b>1ª Coluna:</b> Nome Completo<br>
  <b>2ª Coluna:</b> E-mail<br>
  <b>3ª Coluna:</b> Senha (mínimo de 6 caracteres)<br>
  <b>4ª Coluna:</b> Nome ou Código da Turma (opcional)<br>
  <b>5ª Coluna:</b> Matrícula (opcional)</p>
  <label>Arquivo de Planilha<input name="planilha" type="file" accept=".xlsx, .xls, .csv" required></label>
 `, async()=>{
  const f=$('input[name="planilha"]').files[0];
  if(!f){toast('Selecione um arquivo de planilha');return false}
  
  const data = await f.arrayBuffer();
  const workbook = XLSX.read(data);
  const firstSheetName = workbook.SheetNames[0];
  const worksheet = workbook.Sheets[firstSheetName];
  const rows = XLSX.utils.sheet_to_json(worksheet, {header:1});
  
  if(!rows.length){toast('A planilha está vazia.');return false}
  
  let startIdx = 0;
  const firstRowStr = rows[0].map(c => String(c||'').toLowerCase());
  if(firstRowStr.some(c => c.includes('nome') || c.includes('email') || c.includes('senha') || c.includes('e-mail') || c.includes('turma') || c.includes('matricula'))){
    startIdx = 1;
  }
  
  const studentRows = [];
  for(let i = startIdx; i < rows.length; i++){
    const r = rows[i];
    if(!r || r.length === 0) continue;
    const nome = String(r[0] || '').trim();
    const email = String(r[1] || '').trim();
    const senha = String(r[2] || '').trim();
    const turmaStr = String(r[3] || '').trim();
    const matricula = String(r[4] || '').trim();
    if(nome && email) studentRows.push({nome, email, senha, turmaStr, matricula});
  }
  
  if(!studentRows.length){toast('Nenhum aluno válido encontrado.');return false}
  if(!confirm(`Foram encontrados ${studentRows.length} alunos para cadastro/atualização. Deseja prosseguir?`)) return false;
  
  sec = sec || firebase.initializeApp(cfg, 'sec_lote');
  let sucessos = 0, atualizados = 0, erros = 0;
  const existingUsers = await getAll('users');
  
  for(let st of studentRows){
    let turmaId = '';
    if(st.turmaStr){
      const tFound = L.turmas.find(t => t.nome.toLowerCase() === st.turmaStr.toLowerCase() || t.id === st.turmaStr);
      if(tFound) turmaId = tFound.id;
    }
    
    const existing = existingUsers.find(u => u.email && u.email.toLowerCase() === st.email.toLowerCase());
    let uid = existing ? existing.id : null;
    
    if(!uid){
      if(!st.senha || st.senha.length < 6){ erros++; continue; }
      try {
        const cred = await sec.auth().createUserWithEmailAndPassword(st.email, st.senha);
        uid = cred.user.uid;
        await sec.auth().signOut();
      } catch(e) {
        if(e.code === 'auth/email-already-in-use'){
          try {
            const cred = await sec.auth().signInWithEmailAndPassword(st.email, st.senha);
            uid = cred.user.uid;
            await sec.auth().signOut();
          } catch(e2) { erros++; continue; }
        } else { erros++; continue; }
      }
    }
    
    try {
      await db.collection('users').doc(uid).set({
        nome: st.nome,
        perfil: 'aluno',
        alunoId: uid,
        email: st.email,
        ativo: true,
        criadoEm: TS()
      }, {merge: true});
      
      const alunoData = { nome: st.nome, email: st.email, status: 'Ativo', userId: uid };
      if(st.matricula) alunoData.matricula = st.matricula;
      if(turmaId) alunoData.turmaId = turmaId;
      
      await db.collection('alunos').doc(uid).set(alunoData, {merge: true});
      if(existing) atualizados++; else sucessos++;
    } catch(err) { erros++; }
  }
  
  await syncPerfis();
  toast(`Processamento concluído: ${sucessos} criados, ${atualizados} atualizados.`);
  go('usuarios');
  return true;
}, 'Importar / Atualizar Alunos');
}

const SHIM='<script>(function(){function M(){var d={};return{getItem:function(k){return k in d?d[k]:null},setItem:function(k,v){d[k]=String(v)},removeItem:function(k){delete d[k]},clear:function(){d={}},key:function(i){return Object.keys(d)[i]||null},get length(){return Object.keys(d).length}}}["localStorage","sessionStorage"].forEach(function(n){try{window[n].getItem("x")}catch(e){try{Object.defineProperty(window,n,{value:M(),configurable:true})}catch(e2){}}})})()<\/script>';
async function capaComp(f){if(!f||!f.type.startsWith('image/'))return null;
 const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(f)});
 const k=Math.min(1,1000/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
 const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);

async function sigImg(f){const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(f)});
 for(const mw of [600,420,300]){const k=Math.min(1,mw/img.width),w=Math.round(img.width*k),h=Math.round(img.height*k),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(img,0,0,w,h);
  const d=x.getImageData(0,0,w,h),p=d.data;for(let i=0;i<p.length;i+=4)if(p[i]>232&&p[i+1]>232&&p[i+2]>232)p[i+3]=0;x.putImageData(d,0,0);const u=c.toDataURL('image/png');if(u.length<380000)return u}return null}

 rs.sort((a,b)=>{const ia=CARGOS.indexOf(a.cargo),ib=CARGOS.indexOf(b.cargo);return (ia<0?99:ia)-(ib<0?99:ib)||byNome(a,b)});

function rEdit(id){const r=id?R.resp.find(x=>x.id==id):{ativo:true};

function txLayout(){const t=_tx,[w0,h0]=PAPEIS[t.papel]||PAPEIS.A4,land=t.orient=='paisagem',w=land?h0:w0,h=land?w0:h0,m=MARG[t.margem]||20,sh=$('#sheet');if(!sh)return;
 sh.style.cssText=`width:${w}mm;min-height:${h}mm;padding:${m}mm;font-family:'${t.fonte}',sans-serif;font-size:${t.tam}pt`;
 $('#pgst').textContent=`@media print{@page{size:${w}mm ${h}mm;margin:${m}mm}}`;
 const e=t.esc;$('#thead').innerHTML=t.cab?`<div class="txh">${t.brasao?`<img src="${t.brasao}" alt="Brasão">`:''}<b>${esc(e.nome||'')}</b>${e.orgao&&e.orgao!=e.nome?`<div style="font-size:.85em">${esc(e.orgao)}</div>`:''}</div>`:'';
 const a=t.ass;$('#tsig').innerHTML=a?`<div class="txs"><div class="txsi">${a.img?`<img src="${a.img}" alt="Assinatura">`:''}</div><b>${esc(a.assinante)}</b><br><span style="font-size:.85em">${esc(a.cargo)}</span></div><div class="pfoot"><div class="qr">${qrSvg(valUrl(a.codigo))}</div><div class="ptx">Documento assinado digitalmente por <b>${esc(a.assinante)}</b>, ocupante do cargo/função de <b>${esc(a.cargo)}</b>, matrícula nº <b>${esc(a.mat)}</b>, vinculado(a) ao órgão <b>${esc(a.orgao||'—')}</b>, em <b>${esc(a.data)}</b>, às <b>${esc(a.hora)}</b>.<br>Código de validação: <b>${esc(a.codigo)}</b>. Valide em ${esc(valUrl(a.codigo))}</div></div>`:''}
function txCfg(){const t=_tx;t.papel=$('#tpa').value;t.orient=$('#tor').value;t.margem=$('#tma').value;t.fonte=$('#tfo').value;t.tam=+$('#tta').value;t.cab=$('#tca').checked;txLayout()}
function tx(c,v){const b=$('#tbody');if(!b||_tx.assinado)return;if(_tr){const s=getSelection();s.removeAllRanges();s.addRange(_tr)}b.focus();document.execCommand(c,false,v||null)}
function txSize(v){if(!v)return;tx('fontSize','7');document.querySelectorAll('#tbody font[size="7"]').forEach(f=>{const s=document.createElement('span');s.style.fontSize=v+'pt';s.innerHTML=f.innerHTML;f.replaceWith(s)})}
function txTabela(){const r=prompt('Tabela — linhas x colunas (ex.: 3x3)','3x3');if(!r)return;const[a,b]=r.toLowerCase().split('x').map(n=>Math.max(1,Math.min(30,+n||0)));if(!a||!b)return;tx('insertHTML',`<table><tbody>${('<tr>'+'<td>&nbsp;</td>'.repeat(b)+'</tr>').repeat(a)}</tbody></table><p><br></p>`)}
async function txImg(inp){const f=inp.files[0];if(!f)return;try{const u=await smallImg(f,900,true);if(!u)return toast('Imagem muito grande');tx('insertImage',u)}catch(e){toast('Não foi possível ler a imagem')}inp.value=''}
async function txBrasao(inp){try{let u='';if(inp){const f=inp.files[0];if(!f)return;u=await smallImg(f,420,false);if(!u)return toast('Imagem muito grande')}await db.collection('config').doc('brasao').set({img:u});_tx.brasao=u;toast(u?'Brasão salvo':'Brasão removido');log(u?'Atualizou brasão':'Removeu brasão');if(!u||inp)txOpen(_tx.id)}catch(e){toast('Erro: '+e.message)}}
async function txSave(quiet){const t=_tx,html=clean($('#tbody').innerHTML);if(html.length>900000){toast('O documento ficou grande demais (imagens pesadas). Reduza as imagens.');return false}
 t.titulo=($('#txt').value||'Sem título').trim();t.html=html;await db.collection('textos').doc(t.id).update({titulo:t.titulo,html,orient:t.orient,papel:t.papel,margem:t.margem,fonte:t.fonte,tam:t.tam,cab:t.cab,atualizadoEm:TS()});if(!quiet){toast('Documento salvo');log('Salvou documento',t.titulo)}return true}
function txPrint(){txLayout();window.print()}
function txAssinar(){if(!_tx.resp.length)return toast('Seu usuário não está vinculado a nenhum responsável. Peça ao administrador para vincular em Gestão escolar.');
 modal('Assinar documento',`<p>O documento ficará <b>bloqueado para edição</b> e receberá assinatura digital com QR Code de validação.</p><label>Assinar como<select name="rid">${_tx.resp.map(r=>`<option value="${r.id}">${esc(r.nome)} — ${esc(r.cargo)}${r.condicao?' ('+esc(r.condicao)+')':''}</option>`).join('')}</select></label><label>Digite a sua senha para confirmar<input type="password" name="senha" required autocomplete="current-password"></label>`,async()=>{const d=formData();
  try{await auth.currentUser.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(auth.currentUser.email,d.senha))}catch(e){toast('Senha incorreta');return false}
  if(!await txSave(true))return false;const r=_tx.resp.find(x=>x.id==d.rid),t=_tx,html=t.html,hash=await sha(JSON.stringify([t.titulo,html,t.orient,t.papel,t.margem,t.fonte,t.tam,t.cab])),now=new Date(),ref=db.collection('documentos').doc();
  const a={codigo:ref.id,assinanteId:r.id,assinante:r.nome,cargo:r.cargo+(r.condicao?` (${r.condicao})`:''),mat:r.matricula||'—',orgao:t.esc.orgao||t.esc.nome||'',img:r.assinatura||'',data:now.toLocaleDateString('pt-BR'),hora:now.toLocaleTimeString('pt-BR'),hash},bt=db.batch();
  bt.set(ref,{tipo:'Documento',titulo:t.titulo,hash,textoId:t.id,codigo:ref.id,assinanteId:r.id,assinante:r.nome,cargo:a.cargo,assinanteMat:a.mat,assinatura:a.img,orgao:a.orgao,assinanteUserId:P.id,emitidoPorId:P.id,emitidoPor:P.nome,emitidoEm:TS(),dataTxt:a.data,horaTxt:a.hora});
  bt.update(db.collection('textos').doc(t.id),{assinado:true,ass:a,atualizadoEm:TS()});await bt.commit();log('Assinou documento',t.titulo);toast('Documento assinado');txOpen(t.id);return true},'Assinar documento')}
